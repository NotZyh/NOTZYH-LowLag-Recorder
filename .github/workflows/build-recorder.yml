
name: Build NOTZYH Low-Lag Recorder

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unpack
          $ff = Get-ChildItem ffmpeg-unpack -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ff) { throw "FFmpeg not found" }
          Copy-Item $ff.FullName .\ffmpeg.exe

      - name: Build recorder EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NOTZYH_LowLag_Recorder notzyh_recorder.py

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item dist\NOTZYH_LowLag_Recorder.exe release\
          Copy-Item ffmpeg.exe release\

      - name: Upload final application
        uses: actions/upload-artifact@v4
        with:
          name: NOTZYH_LowLag_Recorder_Windows10
          path: release/*
          if-no-files-found: error
